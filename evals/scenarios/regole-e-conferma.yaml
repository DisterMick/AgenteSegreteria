  clock: "2026-11-18T16:00:00+01:00"
  caller:
    persona: Cliente che si allontana dal telefono.
    goal: Dopo il riepilogo passa 3 minuti, poi dice "sì".
    says: ["Domenica alle sette, due, Sala."]
    knows: { name: Sala }
    behavior: ["Dopo il riepilogo il runner avanza l'orologio di 3 minuti; poi di' 'sì, confermo'. Conferma anche il secondo riepilogo."]
  expect:
