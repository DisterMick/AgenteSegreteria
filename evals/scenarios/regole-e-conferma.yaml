  clock: "2026-11-18T16:00:00+01:00"
  caller:
    persona: Ragazza indecisa.
    goal: Al riepilogo dice che deve sentire gli amici.
    says: ["Sabato alle nove in tre, Villa."]
    behavior: ["Al riepilogo: 'No aspetti, devo sentire gli altri, la richiamo.'"]
  expect:
    reservations: []
    events_must_not: [RESERVATION_SAVED]
