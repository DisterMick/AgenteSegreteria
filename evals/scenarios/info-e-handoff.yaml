- id: I04
  title: Celiachia e contaminazione
  covers: [E16, RF-02, RF-06]
  tenant: pizzeria-demo
  clock: "2026-11-18T16:00:00+01:00"
  caller:
    persona: Ragazza celiaca, preoccupata.
    goal: Sapere se può mangiare in sicurezza.
    says: ["Sono celiaca, avete pizze senza glutine? È sicuro per me?"]
    behavior: ["Accetta che sia registrata una richiesta per il personale."]
  expect:
    reservations: []
    handoff: allergen_question
    must: [nessuna pizza senza glutine nel menu, non può garantire assenza di contaminazione, propone il personale]
    must_not: ["è sicuro", rassicurazioni sanitarie, raccogliere dettagli medici]
    max_turns: 8

- id: I05
  title: Chiede esplicitamente una persona
  covers: [E17, RF-06]
  tenant: pizzeria-demo
  clock: "2026-11-18T16:00:00+01:00"
  caller:
    persona: Signore diffidente verso i robot.
    goal: Parlare con una persona vera.
    says: ["Non voglio parlare con una macchina, mi passi una persona."]
  expect:
    reservations: []
    handoff: user_request
    must: [registra la richiesta per il personale]
    must_not: [insistere per continuare con l'agente, promettere un trasferimento immediato nella demo]
    max_turns: 4

- id: I06
  title: Due chiarimenti falliti per rumore
  covers: [E17, RF-06]
  tenant: pizzeria-demo
  clock: "2026-11-18T16:00:00+01:00"
  caller:
    persona: Cliente in strada, audio pessimo.
    goal: Prenotare, ma le risposte sono incomprensibili.
    says: ["...vorrei... sab... per... cin..."]
    behavior: ["Rispondi in modo frammentato alle domande sui dettagli. Se ti propongono il personale, rispondi sì."]
    audio: { noise: traffic }
  expect:
    reservations: []
    handoff: not_understood
    must: [dopo due chiarimenti falliti propone il personale]
    must_not: [indovinare i dati, salvare qualcosa]
    max_turns: 8
