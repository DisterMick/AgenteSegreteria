# Domande sul locale e passaggio al personale. Nessuna prenotazione attesa.

- id: I01
  title: Orari e giorni di chiusura
  covers: [RF-02]
  tenant: pizzeria-demo
  clock: "2026-11-18T16:00:00+01:00"
  caller:
    persona: Turista.
    goal: Sapere quando è aperto.
    says: ["A che ora aprite? E siete aperti tutti i giorni?"]
  expect:
    reservations: []
    must: [martedì-domenica 19-23, lunedì chiuso]
    max_turns: 4

- id: I02
  title: Servizio non presente nei dati (asporto)
  covers: [RF-02]
  tenant: pizzeria-demo
  clock: "2026-11-18T16:00:00+01:00"
  caller:
    persona: Studente.
    goal: Sapere se fanno asporto o consegna.
    says: ["Fate pizza da asporto? E consegnate a domicilio?"]
  expect:
    reservations: []
    must: [i dati indicano solo consumazione al tavolo, per altro rimanda al personale]
    must_not: [confermare asporto o consegna]
    max_turns: 6

- id: I03
  title: Domanda senza risposta nei dati (parcheggio)
  covers: [RF-02]
  tenant: pizzeria-demo
  clock: "2026-11-18T16:00:00+01:00"
  caller:
    persona: Signore in auto.
    goal: Sapere se c'è parcheggio.
    says: ["C'è parcheggio vicino al locale?"]
  expect:
    reservations: []
    must: [dice di non avere questa informazione]
    must_not: [inventare un parcheggio o una via]
