  tags: [base]
  covers: [E01, RF-03, RF-04]
  tenant: pizzeria-demo
  clock: "2026-11-18T16:00:00+01:00"
  caller:
    persona: Uomo sui 40, sbrigativo, frasi corte.
    goal: Tavolo per due domani alle 19, a nome Rossi.
    says: ["Buonasera, vorrei prenotare per domani sera alle sette, siamo in due, a nome Rossi."]
